[package]
name = "agos-memory"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted agent memory manager: durable, tiered, citation-backed memory for AI agents via MCP and HTTP"
license = "MIT"
keywords = ["ai", "agent", "memory", "mcp", "sqlite"]
categories = ["command-line-utilities", "database"]
readme = "README.md"
repository = "https://github.com/aivoo-app/agos-memory"

[lib]
name = "agos_memory"
path = "src/lib.rs"

[[bin]]
name = "agos-memory"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# MCP server tool surface (issue 0001): the official Rust SDK for the Model
# Context Protocol. Default features give `server` + `macros` + `schemars`;
# transports added here, HTTP nesting via axum in issue 0008. The `reqwest`
# feature stays OFF: it would pull reqwest 0.13 alongside our 0.12 provider
# client for no gain.
rmcp = { version = "3.4", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"
hex = "0.4"
sqlite-vec-src = { path = "crates/sqlite-vec-src" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[features]
default = []
# Opt-in local ONNX embeddings (fastembed). Disabled by default: the target
# hosts are RAM-constrained (a Hermes box OOM-killed at 908 MB).
# Reserved for a future local ONNX provider; the Embedder trait is in place.
local-embed = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "recall_bench"
harness = false

[[bench]]
name = "consolidate_bench"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
