name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (offline; mock providers only)
        run: cargo test --all-targets

      - name: Plan guard (plan/ stays untracked via plan/.gitignore)
        run: |
          if git ls-files plan/ | grep -v '^plan/.gitignore$' | grep -q .; then
            echo "plan-guard: FAIL — plan/ files are tracked"
            git ls-files plan/ | grep -v '^plan/.gitignore$'
            exit 1
          fi
          echo "plan-guard: OK — plan/ is untracked"

      - name: Release build
        run: cargo build --release
